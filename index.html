.mini{width:42px;height:42px;border-radius:10px;background:var(--b);color:white;display:grid;place-items:center;font-size:11px;font-weight:bold}
.brand b{display:block}.brand small,.muted{color:var(--m)}.layout{display:flex;min-height:calc(100vh - 68px)}
aside{width:230px;background:var(--b);color:white;padding:15px 10px}nav button{width:100%;border:0;background:transparent;color:white;text-align:left;padding:11px;border-radius:8px;margin:2px 0;cursor:pointer}nav button.active,nav button:hover{background:#ffffff22}
.section{font-size:11px;opacity:.7;margin:12px;font-weight:bold}main{flex:1;padding:25px;max-width:1450px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0}.actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat strong{display:block;font-size:27px;margin-top:8px}
.toolbar{display:flex;gap:9px;margin-bottom:14px}.toolbar input{padding:10px;border:1px solid #d5ddea;border-radius:9px;min-width:240px}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}th{color:var(--m);font-size:12px}.badge{padding:5px 8px;border-radius:99px;background:#eaf8ef;color:#176b36;font-size:11px;font-weight:bold}
.notice{padding:10px;border-radius:9px;margin-bottom:12px;background:#fff0f0;color:var(--r)}
@media(max-width:850px){aside{width:65px}.section{display:none}nav button{font-size:0;text-align:center}main{padding:15px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}
@media print{aside,header,.actions,.no-print{display:none!important}main{padding:0}}
</style>
