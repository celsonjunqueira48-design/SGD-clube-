/* SUPABASE */

async function initSupabase(){

if(!window.supabase){

throw new Error(
"Supabase não carregou. Verifique a ligação à internet."
);

if(!client){

client =
window.supabase.createClient(
window.SGD_SUPABASE_URL,

/* UTILITÁRIOS */

function esc(x){

return String(x ?? "")
.replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m]));

}


function money(v){

return Number(v || 0).toLocaleString(
"pt-AO",
{
minimumFractionDigits:2,
maximumFractionDigits:2

);

}

function errorMessage(e){

return e?.message ||

}


/* CARREGAR BANCO */

async function loadDB(){

const c =
await initSupabase();

const [
m,
u,
a,
f,
conf
] =
await Promise.all([

c
.from("membros")
.select("*")
.order("created_at",{ascending:true}),

c
.from("unidades")
.select("*")
.order("nome"),

c
.from("atividades")
.select("*")
.order("data",{ascending:false}),

c
.from("financas")
.select("*")
.order("data",{ascending:false}),

c
.from("configuracoes")
.select("*")
.limit(1)

]);


if(m.error) throw m.error;
if(u.error) throw u.error;
if(a.error) throw a.error;
if(f.error) throw f.error;
if(conf.error) throw conf.error;


db.membros = m.data || [];

db.unidades = u.data || [];

db.atividades = a.data || [];

db.financas = f.data || [];

db.config =
conf.data?.[0] || {

nome_clube:"Clube de Desbravadores",
papel:"58 mm",
ficha:"A4"

};

return db;

}


async function refresh(){

try{

return await loadDB();

}catch(e){

console.error(e);

alert(
"Erro ao carregar os dados:\n\n"+
errorMessage(e)
);

return null;

}

}

/* UNIDADE */

function unitName(id){

const u =
db.unidades.find(
x=>String(x.id) === String(id)
);

return u?.nome || "—";

}


/* Nº AUTOMÁTICO */

function nextNumber(){

const year =
new Date().getFullYear();

let max = 0;

db.membros.forEach(m=>{

const number =
String(m.numero_membro || "");

const match =
number.match(/-(\d{4})$/);

if(match){

max =
Math.max(max,Number(match[1]));

}

});

return `
DBV-${year}-${String(max+1).padStart(4,"0")}
`;

}


/* UTILIZADOR AUTOMÁTICO */

function nextUser(){

let n = 1;

while(
db.membros.some(
m =>
m.utilizador ===
`m${String(n).padStart(4,"0")}`
)
){

n++;

}

return `m${String(n).padStart(4,"0")}`;

}


/* PALAVRA-PASSE */

function generatePassword(){

const chars =
"ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

let result = "";

const array =
new Uint32Array(10);

crypto.getRandomValues(array);

array.forEach(n=>{

result +=
chars[n % chars.length];

});

return result;

}

/* UPLOAD FOTO */

async function uploadPhoto(file,id){

if(!file || !file.name){

return null;

}

const c =
await initSupabase();


const ext =
(
file.name
.split(".")
.pop() ||
"jpg"
)
.toLowerCase();


const path =
`membros/${id}-${Date.now()}.${ext}`;


const {error} =
await c.storage
.from("fotos_membros")
.upload(
path,
file,
{
upsert:true,
contentType:
file.type || "image/jpeg"
}
);


if(error){

throw error;

}


const {data} =
c.storage
.from("fotos_membros")
.getPublicUrl(path);


return data.publicUrl;

}

/* GUARDAR MEMBRO */

async function saveMember(e){

e.preventDefault();

const btn =
document.getElementById("saveMember");

btn.disabled = true;

btn.textContent =
"A cadastrar...";


try{

const c =
await initSupabase();

const form =
new FormData(e.target);

const d = {};


const fields = [

"nome",
"nascimento",
"sexo",
"documento",
"telefone",
"endereco",
"unidade_id",
"funcao",
"classe",
"estado",
"pai",
"contacto_encarregado",
"encarregado",
"classe_escolar",
"escola",
"mae",
"data_cadastro"

];


fields.forEach(k=>{

const value =
form.get(k);

if(value !== null && value !== ""){

d[k] = value;

}

});


d.numero_membro =
nextNumber();

d.utilizador =
nextUser();


const password =
generatePassword();


const result =
await c
.from("membros")
.insert([d])
.select()
.single();


if(result.error){

throw result.error;

}


let member =
result.data;


const photo =
form.get("foto");


if(
photo &&
photo.size > 0
){

const url =
await uploadPhoto(
photo,
member.id
);


const update =
await c
.from("membros")
.update({
foto_url:url
})
.eq(
"id",
member.id
);


if(update.error){

throw update.error;

}


member.foto_url =
url;

}


db.membros.push(member);


alert(

"Membro cadastrado com sucesso!\n\n"+

"Nº: "+
member.numero_membro+

"\nUtilizador: "+
member.utilizador+

"\nPalavra-passe inicial: "+
password+

"\n\nAnote estas credenciais."

);


await profile(
member.id,
true
);


}catch(err){

console.error(err);

alert(
"Erro ao cadastrar membro:\n\n"+
errorMessage(err)
);

}finally{

btn.disabled = false;

btn.textContent =
"Cadastrar membro";

}

}

/* LOGIN */

document
.getElementById("loginForm")
.onsubmit =
async function(e){

e.preventDefault();


const loginButton =
document.getElementById("loginBtn");

const loginError =
document.getElementById("loginError");


loginError.classList.add(
"hidden"
);

loginButton.disabled = true;

loginButton.textContent =
"A entrar...";


try{

const form =
new FormData(e.target);

const email =
String(
form.get("user") || ""
)
.trim();

const password =
String(
form.get("pass") || ""
);


if(!email || !password){

throw new Error(
"Digite o e-mail e a palavra-passe."
);

}


const c =
await initSupabase();


const result =
await c.auth.signInWithPassword({

email:email,

password:password

});


if(result.error){

throw result.error;

}


if(!result.data?.session){

throw new Error(
"O Supabase não devolveu uma sessão."
);

}


/*
IMPORTANTE:
A sessão foi criada.
Agora mostramos o sistema.
*/

document
.getElementById("login")
.classList.add("hidden");


document
.getElementById("app")
.classList.remove("hidden");


await page("dashboard");


}catch(error){

console.error(
"ERRO LOGIN:",
error
);


loginError.textContent =
"Não foi possível iniciar sessão: " +
errorMessage(error);


loginError.classList.remove(
"hidden"
);


}finally{

loginButton.disabled = false;

loginButton.textContent =
"Entrar";

}

};


/* SESSÃO AUTOMÁTICA */

(async function(){

try{

const c =
await initSupabase();


const result =
await c.auth.getSession();


if(result.data?.session){

document
.getElementById("login")
.classList.add("hidden");


document
.getElementById("app")
.classList.remove("hidden");


await page("dashboard");

}

}catch(error){

console.error(
"Erro ao verificar sessão:",
error
);

}

})();

</script>

</body>
