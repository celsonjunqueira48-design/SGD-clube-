<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

let client = null;

let db = {
  membros:[],
  unidades:[],
  atividades:[],
  financas:[],
  config:{}
};

const $ = s => document.querySelector(s);

const content = $("#content");


/* =====================================================
   SUPABASE
===================================================== */

async function initSupabase(){

  if(!window.supabase){

    throw new Error(
      "Biblioteca Supabase não carregou."
    );

  }

  if(!client){

    client =
      window.supabase.createClient(
        window.SGD_SUPABASE_URL,
        window.SGD_SUPABASE_ANON_KEY
      );

  }

  return client;
}


/* =====================================================
   CARREGAR BANCO
===================================================== */

async function loadDB(){

  const c = await initSupabase();

  const [
    membros,
    unidades,
    atividades,
    financas,
    configuracoes
  ] = await Promise.all([

    c
      .from("membros")
      .select("*")
      .order("created_at",{ascending:true}),

    c
      .from("unidades")
      .select("*")
      .order("nome"),

    c
      .from("atividades")
      .select("*")
      .order("data",{ascending:false}),

    c
      .from("financas")
      .select("*")
      .order("data",{ascending:false}),

    c
      .from("configuracoes")
      .select("*")
      .limit(1)

  ]);


  if(membros.error)
    throw membros.error;

  if(unidades.error)
    throw unidades.error;

  if(atividades.error)
    throw atividades.error;

  if(financas.error)
    throw financas.error;

  if(configuracoes.error)
    throw configuracoes.error;


  db.membros = membros.data || [];

  db.unidades = unidades.data || [];

  db.atividades = atividades.data || [];

  db.financas = financas.data || [];

  db.config =
    configuracoes.data?.[0] || {

      nome_clube:
        "Clube de Desbravadores",

      papel:"58 mm",

      ficha:"A4"

    };


  return db;
}


/* =====================================================
   REFRESH
===================================================== */

async function refresh(){

  try{

    await loadDB();

    return true;

  }catch(e){

    console.error(e);

    alert(
      "Não foi possível carregar os dados do Supabase.\n\n"+
      e.message
    );

    return false;

  }

}


/* =====================================================
   UTILITÁRIOS
===================================================== */

function esc(x){

  return String(x ?? "")
    .replace(/[&<>"']/g,m => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[m]));

}


function money(v){

  return Number(v || 0)
    .toLocaleString(
      "pt-AO",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}


function today(){

  return new Date()
    .toISOString()
    .slice(0,10);

}


/* =====================================================
   NÚMERO AUTOMÁTICO
===================================================== */

function nextNumber(){

  const year =
    new Date().getFullYear();

  let maior = 0;

  db.membros.forEach(m => {

    const n =
      String(m.numero_membro || "");

    const match =
      n.match(/(\d+)$/);

    if(match){

      const numero =
        parseInt(match[1]);

      if(numero > maior)
        maior = numero;

    }

  });

  return (
    "DBV-" +
    year +
    "-" +
    String(maior + 1).padStart(4,"0")
  );

}


/* =====================================================
   UTILIZADOR AUTOMÁTICO
===================================================== */

function nextUtilizador(){

  let maior = 0;

  db.membros.forEach(m => {

    const u =
      String(m.utilizador || "");

    const match =
      u.match(/m(\d+)/i);

    if(match){

      const numero =
        parseInt(match[1]);

      if(numero > maior)
        maior = numero;

    }

  });

  return (
    "m" +
    String(maior + 1).padStart(4,"0")
  );

}


/* =====================================================
   PASSWORD TEMPORÁRIA
===================================================== */

function generatePassword(){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

  let password = "";

  for(let i=0;i<8;i++){

    password +=
      chars.charAt(
        Math.floor(
          Math.random()*chars.length
        )
      );

  }

  return password;

}


/* =====================================================
   BOTÃO
===================================================== */

function B(
  text,
  color="primary",
  fn=""
){

  return `
    <button
      type="button"
      class="btn ${color}"
      onclick="${fn}"
    >
      ${text}
    </button>
  `;

}


/* =====================================================
   TÍTULO
===================================================== */

function T(
  h,
  s,
  b=""
){

  return `
    <div class="top">

      <div>

        <h1>${h}</h1>

        <p class="muted">
          ${s}
        </p>

      </div>

      ${b}

    </div>
  `;

}


/* =====================================================
   FIELD
===================================================== */

function field(
  n,
  l,
  t="text",
  req=false
){

  return `
    <div class="field">

      <label>
        ${l}
      </label>

      <input
        name="${n}"
        type="${t}"
        ${req ? "required" : ""}
      >

    </div>
  `;

}


/* =====================================================
   SELECT
===================================================== */

function select(
  n,
  l,
  arr,
  req=false
){

  return `
    <div class="field">

      <label>
        ${l}
      </label>

      <select
        name="${n}"
        ${req ? "required" : ""}
      >

        <option value="">
          Selecionar
        </option>

        ${arr.map(x => `
          <option value="${esc(x)}">
            ${esc(x)}
          </option>
        `).join("")}

      </select>

    </div>
  `;

}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

function page(p){

  document
    .querySelectorAll("nav button")
    .forEach(b => {

      b.classList.toggle(
        "active",
        b.dataset.page === p
      );

    });

  if(pages[p])
    pages[p]();

}


/* =====================================================
   DASHBOARD
===================================================== */

async function dashboard(){

  if(!await refresh())
    return;

  const receitas =
    db.financas
      .filter(x => x.tipo === "Receita")
      .reduce(
        (a,x) =>
          a + Number(x.valor || 0),
        0
      );

  const despesas =
    db.financas
      .filter(x => x.tipo === "Despesa")
      .reduce(
        (a,x) =>
          a + Number(x.valor || 0),
        0
      );

  content.innerHTML =

    T(
      "Dashboard",
      "Visão geral do clube",
      B(
        "+ Cadastrar membro",
        "primary",
        "page('membroForm')"
      )
    )

    +

    `
    <div class="cards">

      <div class="card stat">
        👥 Membros
        <strong>
          ${db.membros.length}
        </strong>
      </div>

      <div class="card stat">
        🏕️ Unidades
        <strong>
          ${
            db.unidades.filter(
              x => x.estado === "Ativa"
            ).length
          }
        </strong>
      </div>

      <div class="card stat">
        📅 Atividades
        <strong>
          ${db.atividades.length}
        </strong>
      </div>

      <div class="card stat">
        💰 Saldo
        <strong>
          ${money(receitas-despesas)} Kz
        </strong>
      </div>

    </div>

    <div class="card">

      <h3>Acesso rápido</h3>

      <div
        class="actions"
        style="justify-content:flex-start"
      >

        ${B(
          "Lista geral",
          "light",
          "page('membros')"
        )}

        ${B(
          "Unidades",
          "light",
          "page('unidades')"
        )}

        ${B(
          "Atividades",
          "light",
          "page('atividades')"
        )}

        ${B(
          "Finanças",
          "light",
          "page('financas')"
        )}

        ${B(
          "Relatórios",
          "light",
          "page('relatorios')"
        )}

      </div>

    </div>
    `;

}


/* =====================================================
   MEMBROS
===================================================== */

async function membros(){

  if(!await refresh())
    return;

  content.innerHTML =

    T(
      "Lista geral dos membros",
      "Pesquisar e consultar os membros cadastrados",
      B(
        "+ Cadastrar membro",
        "primary",
        "page('membroForm')"
      )
    )

    +

    `
    <div class="card">

      <div class="toolbar">

        <input
          id="search"
          placeholder="Pesquisar por nome, Nº ou utilizador..."
          oninput="renderMemberTable()"
        >

      </div>

      <div style="overflow:auto">

        <table>

          <thead>

            <tr>

              <th>Foto</th>
              <th>Nº</th>
              <th>Nome</th>
              <th>Unidade</th>
              <th>Função</th>
              <th>Classe</th>
              <th>Telefone</th>
              <th>Estado</th>
              <th>Ação</th>

            </tr>

          </thead>

          <tbody id="memberRows"></tbody>

        </table>

      </div>

    </div>
    `;

  renderMemberTable();

}


function renderMemberTable(){

  const q =
    ($("#search")?.value || "")
      .toLowerCase();

  const arr =
    db.membros.filter(m => {

      const texto = (

        (m.nome || "") +
        " " +
        (m.numero_membro || "") +
        " " +
        (m.utilizador || "")

      ).toLowerCase();

      return texto.includes(q);

    });


  const rows =
    arr.map(m => {

      const foto =
        m.foto_url
          ? `
            <img
              src="${esc(m.foto_url)}"
              style="
                width:45px;
                height:45px;
                object-fit:cover;
                border-radius:8px;
              "
            >
          `
          :
          `
            <div
              style="
                width:45px;
                height:45px;
                border-radius:8px;
                background:#eef4ff;
                display:grid;
                place-items:center;
              "
            >
              👤
            </div>
          `;

      return `

        <tr>

          <td>
            ${foto}
          </td>

          <td>
            <b>
              ${esc(m.numero_membro)}
            </b>
          </td>

          <td>
            ${esc(m.nome)}
          </td>

          <td>
            ${esc(getUnitName(m.unidade_id))}
          </td>

          <td>
            ${esc(m.funcao || "—")}
          </td>

          <td>
            ${esc(m.classe || "—")}
          </td>

          <td>
            ${esc(m.telefone || "—")}
          </td>

          <td>
            <span class="badge">
              ${esc(m.estado || "Ativo")}
            </span>
          </td>

          <td>
            ${B(
              "Abrir",
              "light",
              `profile('${m.id}')`
            )}
          </td>

        </tr>

      `;

    }).join("");


  $("#memberRows").innerHTML =
    rows ||

    `
      <tr>
        <td colspan="9" class="muted">
          Nenhum membro encontrado.
        </td>
      </tr>
    `;

}


/* =====================================================
   UNIDADE POR ID
===================================================== */

function getUnitName(id){

  if(!id)
    return "—";

  const u =
    db.unidades.find(
      x => String(x.id) === String(id)
    );

  return u?.nome || "—";

}


/* =====================================================
   FORMULÁRIO DE MEMBRO
===================================================== */

  if(!await refresh())

  const numero =

  const utilizador =

  content.innerHTML =

      "Preencha os dados do novo membro",
      B(
        "← Lista geral",
        "light",
        "page('membros')"
      )
    )

    +

    `
    <form id="mf">

      <div class="card">

        <h3>
          Credenciais do membro
        </h3>

        <div class="grid">

          ${field(

        /* =========================

          numero_membro:

          nome:

            form.get("documento") || null,

          telefone:
            form.get("telefone") || null,

          endereco:
            form.get("endereco") || null,

            form.get("escola") || null,

            form.get("mae") || null,

          utilizador:
            form.get("utilizador"),

          data_cadastro:
            form.get("data_cadastro")

        };


        /* =========================
           FOTO
        ========================= */

        if(
          foto &&
          foto instanceof File &&
          foto.size > 0
        ){

          button.textContent =
            "A enviar fotografia...";


          const c =
            await initSupabase();


          const ext =
            foto.name
              .split(".")
              .pop()
              .toLowerCase() || "jpg";


          const nomeArquivo =
            `${crypto.randomUUID()}.${ext}`;


          const caminho =
            `membros/${nomeArquivo}`;


          const upload =
            await c.storage
              .from("fotos_membros")
              .upload(
                caminho,
                foto,
                {
                  cacheControl:"3600",
                  upsert:false,
                  contentType:
                    foto.type || "image/jpeg"
                }
              );


          if(upload.error)
            throw upload.error;


          const publicUrl =
            c.storage
              .from("fotos_membros")
              .getPublicUrl(caminho);


          d.foto_url =
            publicUrl.data.publicUrl;

        }


        /* =========================
           INSERIR MEMBRO
        ========================= */

        button.textContent =
          "A guardar membro...";


        const c =
          await initSupabase();


        const result =
          await c
            .from("membros")
            .insert([d])
            .select()
            .single();


        if(result.error)
          throw result.error;


        alert(
          "Membro cadastrado com sucesso!\n\n"+
          "Nº: " +
          d.numero_membro +
          "\n"+
          "Utilizador: " +
          d.utilizador +
          "\n"+
          "Palavra-passe inicial: " +
          form.get("senha_temporaria")
        );


        await profile(
          result.data.id,
          true
        );


      }catch(err){

        console.error(err);

        alert(
          "Erro ao cadastrar membro:\n\n"+
          err.message
        );

        button.disabled = false;

        button.textContent =
          "Cadastrar membro";

      }

    };

}

              <th>Tipo</th>

              <th>Categoria</th>
              <th>Descrição</th>

async function definicoes(){

  if(!await refresh())
    return;


  content.innerHTML =

    T(
      "Definições gerais",
      "Configurações do clube e impressão"
    )

    +

    `
    <form id="cf">

      <div class="card">

        <h3>
          Dados do clube
        </h3>

        <div class="grid">

          ${field(
            "nome_clube",
            "Nome do clube"
          )}

          ${field(
            "diretor",
            "Diretor"
          )}

          ${field(
            "telefone",
            "Telefone"
          )}

          ${field(
            "email",
            "E-mail"
          )}

        </div>

      </div>


      <div class="card">

        <h3>
          Impressão
        </h3>

        <div class="grid">

          ${select(
            "papel",
            "Papel térmico",
            [
              "58 mm",
              "80 mm"
            ]
          )}

          ${select(
            "ficha",
            "Ficha principal",
            [
              "A4"
            ]
          )}

        </div>

      </div>


      <div class="actions">

        <button class="btn primary">
          Guardar definições
        </button>

      </div>

    </form>
    `;


  [
    "nome_clube",
    "diretor",
    "telefone",
    "email",
    "papel",
    "ficha"
  ].forEach(k => {

    const el =
      $(`[name="${k}"]`);

    if(el)
      el.value =
        db.config[k] || "";

  });


  $("#cf").onsubmit =
    async e => {

      e.preventDefault();

      try{

        const d =
          Object.fromEntries(
            new FormData(e.target)
          );


        const c =
          await initSupabase();


        let result;


        if(db.config.id){

          result =
            await c
              .from("configuracoes")
              .update(d)
              .eq("id",db.config.id);

        }else{

          result =
            await c
              .from("configuracoes")
              .insert([d]);

        }


        if(result.error)
          throw result.error;


        alert(
          "Definições guardadas."
        );


        await refresh();


      }catch(err){

        alert(
          "Erro:\n\n"+
          err.message
        );

      }

    };

}

===================================================== */

async function conta(){

  try{

    const c =
      await initSupabase();


    const {data,error} =
      await c.auth.getUser();


    if(error)
      throw error;


    const email =
      data.user?.email || "";


    content.innerHTML =

      T(
        "Minha conta",
        "Gerencie as suas credenciais"
      )

      +

      `
      <div class="card">

        <h3>
          Conta atual
        </h3>

        <p>
          <b>E-mail:</b>
          ${esc(email)}
        </p>

      </div>


      <div class="card">

        <h3>
          Alterar palavra-passe
        </h3>

        <form id="passwordForm">

          ${field(
            "novaSenha",
            "Nova palavra-passe",
            "password",
            true
          )}

          ${field(
            "confirmarSenha",
            "Confirmar palavra-passe",
            "password",
            true
          )}

          <div class="actions">

            <button class="btn primary">
              Alterar palavra-passe
            </button>

          </div>

        </form>

      </div>


      <div class="card">

        <h3>
          Alterar e-mail
        </h3>

        <p class="muted">
          O Supabase poderá pedir confirmação
          do novo e-mail.
        </p>

        <form id="emailForm">

          ${field(
            "novoEmail",
            "Novo e-mail",
            "email",
            true
          )}

          <div class="actions">

            <button class="btn primary">
              Alterar e-mail
            </button>

          </div>

        </form>

      </div>
      `;


    $("#passwordForm").onsubmit =
      async e => {

        e.preventDefault();


        const d =
          Object.fromEntries(
            new FormData(e.target)
          );


        if(
          d.novaSenha !==
          d.confirmarSenha
        ){

          alert(
            "As palavras-passe não coincidem."
          );

          return;

        }


        if(d.novaSenha.length < 6){

          alert(
            "A palavra-passe deve ter pelo menos 6 caracteres."
          );

          return;

        }


        try{

          const {error} =
            await c.auth.updateUser({

              password:
                d.novaSenha

            });


          if(error)
            throw error;


          alert(
            "Palavra-passe alterada com sucesso."
          );


          e.target.reset();


        }catch(err){

          alert(
            "Erro:\n\n"+
            err.message
          );

        }

      };


    $("#emailForm").onsubmit =
      async e => {

        e.preventDefault();


        const d =
          Object.fromEntries(
            new FormData(e.target)
          );


        try{

          const {error} =
            await c.auth.updateUser({

              email:
                d.novoEmail

            });


          if(error)
            throw error;


          alert(
            "Pedido de alteração enviado.\n\n"+
            "Verifique o novo endereço de e-mail."
          );


          e.target.reset();


        }catch(err){

          alert(
            "Erro:\n\n"+
            err.message
          );

        }

      };


  }catch(err){

    alert(
      "Não foi possível carregar a conta:\n\n"+
      err.message
    );

  }

}

/* =====================================================
   LOGIN
===================================================== */

$("#loginForm").onsubmit =
  async e => {

    e.preventDefault();


    const button =
      $("#loginButton");

    const d =
      Object.fromEntries(
        new FormData(e.target)
      );


    $("#loginError")
      .classList
      .add("hidden");


    button.disabled = true;

    button.textContent =
      "A entrar...";


    try{

      const c =
        await initSupabase();


      const {
        data,
        error
      } =
        await c.auth.signInWithPassword({

          email:
            d.user.trim(),

          password:
            d.pass

        });


      if(error)
        throw error;


      if(!data.session){

        throw new Error(
          "A sessão não foi criada."
        );

      }


      if(d.remember){

        localStorage.setItem(
          "sgd_remember",
          "1"
        );

      }else{

        localStorage.removeItem(
          "sgd_remember"
        );

      }


      $("#login")
        .classList
        .add("hidden");


      $("#app")
        .classList
        .remove("hidden");


      await dashboard();


    }catch(err){

      console.error(
        "ERRO LOGIN:",
        err
      );


      $("#loginError")
        .textContent =
          "Não foi possível iniciar sessão: " +
          err.message;


      $("#loginError")
        .classList
        .remove("hidden");


      button.disabled = false;

      button.textContent =
        "Entrar";

    }

  };


/* =====================================================
   INICIALIZAÇÃO DA SESSÃO
===================================================== */

(async function(){

  try{

    const c =
      await initSupabase();


    const {
      data,
      error
    } =
      await c.auth.getSession();


    if(error)
      throw error;


    if(data.session){

      $("#login")
        .classList
        .add("hidden");


      $("#app")
        .classList
        .remove("hidden");


      await dashboard();

    }

  }catch(e){

    console.error(
      "Erro ao verificar sessão:",
      e
    );

  }

})();
