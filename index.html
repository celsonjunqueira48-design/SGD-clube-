<script>

let client;
let db={
membros:[],
unidades:[],
atividades:[],
financas:[],
config:{}
};

const $=s=>document.querySelector(s);
const content=$("#content");


async function supabase(){

if(!client){

client=window.supabase.createClient(
window.SGD_SUPABASE_URL,
window.SGD_SUPABASE_ANON_KEY
);

}

return client;

}


async function loadDB(){

const c=await supabase();

const [m,u,a,f,conf]=await Promise.all([

c.from("membros").select("*").order("created_at",{ascending:true}),

c.from("unidades").select("*").order("nome"),

c.from("atividades").select("*").order("data",{ascending:false}),

c.from("financas").select("*").order("data",{ascending:false}),

c.from("configuracoes").select("*").limit(1)

]);

if(m.error)throw m.error;
if(u.error)throw u.error;
if(a.error)throw a.error;
if(f.error)throw f.error;
if(conf.error)throw conf.error;

db.membros=m.data||[];
db.unidades=u.data||[];
db.atividades=a.data||[];
db.financas=f.data||[];
db.config=conf.data?.[0]||{};

}


async function refresh(){

try{

await loadDB();

}catch(e){

console.error(e);

alert("Erro ao carregar o Supabase: "+e.message);

}

}


function esc(v){

return String(v??"").replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m]));

}


function money(v){

return Number(v||0).toLocaleString("pt-AO",{
minimumFractionDigits:2,
maximumFractionDigits:2
});

}


function numeroMembro(){

const ano=new Date().getFullYear();

let maior=0;

db.membros.forEach(m=>{

let n=String(m.numero_membro||"");

let match=n.match(/-(\d+)$/);

if(match){

maior=Math.max(maior,Number(match[1]));

}

});

return "DBV-"+ano+"-"+String(maior+1).padStart(4,"0");

}


function utilizador(){

const n=numeroMembro().split("-").pop();

return "M"+n;

}


function senhaInicial(){

const chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

let s="SGD@";

for(let i=0;i<8;i++){

s+=chars[Math.floor(Math.random()*chars.length)];

}

return s;

}


function field(n,l,t="text",req=false){

return `
<div class="field">
<label>${l}</label>
<input name="${n}" type="${t}" ${req?"required":""}>
</div>`;

}


function select(n,l,arr,req=false){

return `
<div class="field">
<label>${l}</label>

<select name="${n}" ${req?"required":""}>

<option value="">Selecionar</option>

${arr.map(x=>{

if(typeof x==="object"){

return `<option value="${esc(x.id)}">${esc(x.nome)}</option>`;

}

return `<option>${esc(x)}</option>`;

}).join("")}

</select>

</div>`;

}


function top(title,text,button=""){

return `
<div class="top">

<div>
<h1>${title}</h1>
<p>${text}</p>
</div>

${button}

</div>`;

}


function btn(text,cls="primary",fn=""){

return `<button class="btn ${cls}" onclick="${fn}">${text}</button>`;

}


function page(p){

if(pages[p])pages[p]();

}

async function definicoes(){

await refresh();

content.innerHTML=

top(
"Definições",
"Configurações do clube"
)+

`
<form id="configForm">

<div class="card">

<div class="grid">

${field("nome_clube","Nome do clube")}

${field("diretor","Diretor")}

${field("telefone","Telefone")}

${field("email","E-mail")}

${select(
"papel",
"Papel térmico",
["58 mm","80 mm"]
)}

${select(
"ficha",
"Ficha",
["A4"]
)}

</div>

</div>

<div class="actions">

<button class="btn primary">
Guardar definições
</button>

</div>

</form>`;


[
"nome_clube",
"diretor",
"telefone",
"email",
"papel",
"ficha"
].forEach(k=>{

let el=$(`[name="${k}"]`);

if(el)el.value=db.config[k]||"";

});


$("#configForm").onsubmit=async e=>{

e.preventDefault();

let d=Object.fromEntries(new FormData(e.target));

try{

const c=await supabase();

let result;

if(db.config.id){

result=await c
.from("configuracoes")
.update(d)
.eq("id",db.config.id);

}else{

result=await c
.from("configuracoes")
.insert([d]);

}

if(result.error)throw result.error;

alert("Definições guardadas.");

}catch(err){

alert("Erro: "+err.message);

}

};

}

async function conta(){

const c=await supabase();

const {data,error}=await c.auth.getUser();

if(error)throw error;

content.innerHTML=

top(
"Minha conta",
"Dados da conta administrativa"
)+

`
<div class="card">

<h3>E-mail atual</h3>

<p>${esc(data.user?.email||"")}</p>

</div>

<div class="card">

<h3>Alterar palavra-passe</h3>

<form id="passwordForm">

${field(
"senha",
"Nova palavra-passe",
"password",
true
)}

${field(
"confirmar",
"Confirmar palavra-passe",
"password",
true
)}

<div class="actions">

<button class="btn primary">
Alterar
</button>

</div>

</form>

</div>`;


$("#passwordForm").onsubmit=async e=>{

e.preventDefault();

let d=Object.fromEntries(new FormData(e.target));

if(d.senha!==d.confirmar){

alert("As palavras-passe não coincidem.");

return;

}

const {error}=await c.auth.updateUser({
password:d.senha
});

if(error){

alert("Erro: "+error.message);

return;

}

alert("Palavra-passe alterada com sucesso.");

e.target.reset();

};

}

/* LOGIN */

$("#loginForm").onsubmit=async e=>{

e.preventDefault();

$("#loginError").classList.add("hidden");

let d=Object.fromEntries(new FormData(e.target));

try{

const c=await supabase();

const {error}=await c.auth.signInWithPassword({

email:d.email.trim(),

password:d.password

});

if(error)throw error;

$("#login").classList.add("hidden");

$("#app").classList.remove("hidden");

await dashboard();

}catch(err){

console.error(err);

$("#loginError").textContent=
"Erro ao entrar: "+err.message;

$("#loginError").classList.remove("hidden");

}

};


/* SESSÃO */

(async()=>{

try{

const c=await supabase();

const {data}=await c.auth.getSession();

if(data.session){

$("#login").classList.add("hidden");

$("#app").classList.remove("hidden");

await dashboard();

}

}catch(e){

console.error(e);

}

})();

</script>
