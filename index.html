<script>

let client=null;
let db={
membros:[],
unidades:[],
atividades:[],
financas:[],
config:{}
};

const $=s=>document.querySelector(s);
const content=$("#content");

async function initSupabase(){
if(!window.supabase) throw new Error("Supabase não carregou.");
if(!client){
client=window.supabase.createClient(
window.SGD_SUPABASE_URL,
window.SGD_SUPABASE_ANON_KEY
);
}
return client;
}


/* =========================
   SUPABASE
========================= */

async function loadDB(){

const c=await initSupabase();

const [m,u,a,f,conf]=await Promise.all([
c.from("membros").select("*").order("created_at",{ascending:true}),
c.from("unidades").select("*").order("nome"),
c.from("atividades").select("*").order("data",{ascending:false}),
c.from("financas").select("*").order("data",{ascending:false}),
c.from("configuracoes").select("*").limit(1)
]);

if(m.error) throw m.error;
if(u.error) throw u.error;
if(a.error) throw a.error;
if(f.error) throw f.error;
if(conf.error) throw conf.error;

db.membros=m.data||[];
db.unidades=u.data||[];
db.atividades=a.data||[];
db.financas=f.data||[];
db.config=conf.data?.[0]||{
nome_clube:"Clube de Desbravadores",
papel:"58 mm",
ficha:"A4"
};

return db;
}


async function refresh(){
try{
await loadDB();
}catch(e){
console.error(e);
alert("Não foi possível carregar os dados do Supabase.");
}
}


/* =========================
   UTILITÁRIOS
========================= */

function esc(x){
return String(x??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m]));
}

function money(v){
return Number(v||0).toLocaleString("pt-AO",{
minimumFractionDigits:2,
maximumFractionDigits:2
});
}

function nextNumber(){
let year=new Date().getFullYear();
let n=db.membros.length+1;
return "DBV-"+year+"-"+String(n).padStart(4,"0");
}

function B(t,c="primary",fn=""){
return `<button class="btn ${c}" onclick="${fn}">${t}</button>`;
}

function T(h,s,b=""){
return `<div class="top">
<div>
<h1>${h}</h1>
<p class=muted>${s}</p>
</div>
${b}
</div>`;
}

function field(n,l,t="text",req=false){
return `<div class=field>
<label>${l}</label>
<input name="${n}" type="${t}" ${req?"required":""}>
</div>`;
}

function select(n,l,arr,req=false){
return `<div class=field>
<label>${l}</label>
<select name="${n}" ${req?"required":""}>
<option value="">Selecionar</option>
${arr.map(x=>`<option>${esc(x)}</option>`).join("")}
</select>
</div>`;
}


/* =========================
   NAVEGAÇÃO
========================= */

function page(p){
document.querySelectorAll("nav button").forEach(b=>{
b.classList.toggle("active",b.dataset.page===p);
});
if(pages[p]) pages[p]();
}

function renderMemberTable(){

let arr=db.membros.filter(m=>
(`${m.nome||""} ${m.numero||""}`).toLowerCase().includes(q)
);

$("#memberRows").innerHTML=
arr.map(m=>{

let i=db.membros.findIndex(x=>x.id===m.id);

return `
<tr>
<td><b>${esc(m.numero)}</b></td>
<td>${esc(m.nome)}</td>
<td>${esc(m.unidade||"—")}</td>
<td>${esc(m.funcao||"—")}</td>

<td><span class=badge>${esc(m.estado||"Ativo")}</span></td>
<td>${B("Abrir","light",`profile('${m.id}')`)}</td>
</tr>`;

}).join("")||
`<tr><td colspan=8 class=muted>Nenhum membro encontrado.</td></tr>`;

</div>

</form>

</div>

<div class=actions>
<button class="btn primary">Alterar e-mail</button>
</div>

</form>

</div>`;

$("#passwordForm").onsubmit=async e=>{

e.preventDefault();

let d=Object.fromEntries(new FormData(e.target));

if(d.novaSenha!==d.confirmarSenha){

alert("As palavras-passe não coincidem.");
return;

}

if(d.novaSenha.length<6){

alert("A palavra-passe deve ter pelo menos 6 caracteres.");
return;

}

try{

const {error}=await c.auth.updateUser({
password:d.novaSenha
});

if(error)throw error;

alert("Palavra-passe alterada com sucesso.");

e.target.reset();

}catch(err){

alert("Erro ao alterar palavra-passe: "+err.message);

}

};


$("#emailForm").onsubmit=async e=>{

e.preventDefault();

let d=Object.fromEntries(new FormData(e.target));

try{

const {error}=await c.auth.updateUser({
email:d.novoEmail
});

if(error)throw error;

alert("Pedido de alteração de e-mail enviado. Verifique o novo endereço.");

e.target.reset();

}catch(err){

alert("Erro ao alterar e-mail: "+err.message);

}

};

}

$("#loginForm").onsubmit=async e=>{

e.preventDefault();

const d=Object.fromEntries(new FormData(e.target));

$("#loginError").classList.add("hidden");

try{

const c=await initSupabase();

const {data,error}=await c.auth.signInWithPassword({
email:d.user.trim(),
password:d.pass
});

if(error)throw error;

if(d.remember){
localStorage.setItem("sgd_remember","1");
}else{
localStorage.removeItem("sgd_remember");
}

$("#login").classList.add("hidden");
$("#app").classList.remove("hidden");

await page("dashboard");

}catch(err){

console.error(err);

$("#loginError").textContent=
"E-mail ou palavra-passe incorretos.";

$("#loginError").classList.remove("hidden");

}

};
