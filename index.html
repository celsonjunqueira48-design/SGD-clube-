<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SGD - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f1f5f9;
    font-family:Arial,sans-serif;
}

.login{
    width:100%;
    max-width:420px;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.logo{
    width:80px;
    height:80px;
    margin:0 auto 15px;
    background:#1769e0;
    color:white;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
}

h1{
    text-align:center;
    margin:5px 0;
}

.sub{
    text-align:center;
    color:#64748b;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    margin-bottom:16px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#1769e0;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.mensagem{
    display:none;
    margin-bottom:15px;
    padding:12px;
    border-radius:9px;
    font-size:14px;
    white-space:pre-wrap;
}

.erro{
    display:block;
    background:#fff0f0;
    color:#b42318;
}

.sucesso{
    display:block;
    background:#eaf8ef;
    color:#16794a;
}

#sistema{
    display:none;
    position:fixed;
    inset:0;
    background:#f1f5f9;
}

.topo{
    height:65px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 20px;
}

.topo strong{
    font-size:18px;
}

.sair{
    width:auto;
    margin-left:auto;
    padding:9px 15px;
}

.conteudo{
    padding:30px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    max-width:800px;
}
</style>
</head>

<body>

<div id="login" class="login">

    <div class="logo">SGD</div>

    <h1>SGD</h1>

    <div class="sub">
        Sistema de Gestão do Clube
    </div>

    <div id="mensagem" class="mensagem"></div>

    <form id="loginForm">

        <label for="email">
            E-mail
        </label>

        <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="Digite o seu e-mail"
            required
        >

        <label for="senha">
            Palavra-passe
        </label>

        <input
            id="senha"
            type="password"
            autocomplete="current-password"
            placeholder="Digite a sua palavra-passe"
            required
        >

        <button id="btnEntrar" type="submit">
            Entrar
        </button>

    </form>

</div>


<div id="sistema">

    <div class="topo">

        <strong>
            SGD — Sistema de Gestão do Clube
        </strong>

        <button
            class="sair"
            onclick="sair()"
        >
            Sair
        </button>

    </div>

    <div class="conteudo">

        <div class="card">

            <h2>Dashboard</h2>

            <p>
                Sessão iniciada com sucesso.
            </p>

            <p>
                <strong>Utilizador:</strong>
                <span id="usuarioLogado"></span>
            </p>

            <hr>

            <p>
                Agora podemos ligar novamente todas as funções
                de membros, unidades, atividades e finanças.
            </p>

        </div>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO SUPABASE
===================================================== */

const SUPABASE_URL =
"https://edttbjysaqdounpghsdn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-pb2KXvmOPN8FbZLdCgeFg_5Me7Y0V2";


/* =====================================================
   CRIAR CLIENTE
===================================================== */

let supabaseClient;

try{

    if(!window.supabase){

        throw new Error(
            "A biblioteca do Supabase não carregou."
        );

    }

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

}catch(error){

    mostrarErro(
        "Erro ao carregar o Supabase:\n\n" +
        error.message
    );

}


/* =====================================================
   ELEMENTOS
===================================================== */

const login =
document.getElementById("login");

const sistema =
document.getElementById("sistema");

const form =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const senhaInput =
document.getElementById("senha");

const botao =
document.getElementById("btnEntrar");

const mensagem =
document.getElementById("mensagem");

const usuarioLogado =
document.getElementById("usuarioLogado");


/* =====================================================
   MENSAGENS
===================================================== */

function limparMensagem(){

    mensagem.textContent = "";

    mensagem.className =
        "mensagem";

}


function mostrarErro(texto){

    mensagem.textContent = texto;

    mensagem.className =
        "mensagem erro";

}


function mostrarSucesso(texto){

    mensagem.textContent = texto;

    mensagem.className =
        "mensagem sucesso";

}


/* =====================================================
   MOSTRAR SISTEMA
===================================================== */

function abrirSistema(usuario){

    login.style.display = "none";

    sistema.style.display = "block";

    if(usuario){

        usuarioLogado.textContent =
            usuario.email || "";

    }

}


/* =====================================================
   LOGIN
===================================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        limparMensagem();

        const email =
            emailInput.value.trim();

        const senha =
            senhaInput.value;

        if(!email){

            mostrarErro(
                "Digite o e-mail."
            );

            return;

        }

        if(!senha){

            mostrarErro(
                "Digite a palavra-passe."
            );

            return;

        }

        botao.disabled = true;

        botao.textContent =
            "A entrar...";

        try{

            console.log(
                "Tentando iniciar sessão:",
                email
            );

            const resultado =
                await supabaseClient.auth.signInWithPassword({

                    email:email,

                    password:senha

                });

            console.log(
                "Resposta Supabase:",
                resultado
            );

            const {data,error} =
                resultado;


            /* ==========================================
               ERRO
            ========================================== */

            if(error){

                console.error(
                    "Erro Supabase:",
                    error
                );

                mostrarErro(
                    "ERRO DO SUPABASE\n\n" +
                    "Mensagem: " +
                    (error.message || "Sem mensagem") +
                    "\n\nCódigo: " +
                    (error.code || "Sem código") +
                    "\n\nStatus: " +
                    (error.status || "Sem status")
                );

                return;

            }


            /* ==========================================
               SEM SESSÃO
            ========================================== */

            if(!data || !data.session){

                mostrarErro(
                    "O Supabase não devolveu uma sessão.\n\n" +
                    "Verifique se a conta está autorizada a iniciar sessão."
                );

                return;

            }


            /* ==========================================
               SUCESSO
            ========================================== */

            console.log(
                "LOGIN REALIZADO:",
                data.user
            );

            mostrarSucesso(
                "Sessão iniciada com sucesso."
            );

            setTimeout(function(){

                abrirSistema(data.user);

            },500);


        }catch(error){

            console.error(
                "Erro inesperado:",
                error
            );

            mostrarErro(
                "ERRO INESPERADO\n\n" +
                error.message
            );

        }finally{

            botao.disabled = false;

            botao.textContent =
                "Entrar";

        }

    }
);


/* =====================================================
   VERIFICAR SESSÃO EXISTENTE
===================================================== */

async function verificarSessao(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if(error){

            console.error(
                "Erro ao verificar sessão:",
                error
            );

            return;

        }


        if(data && data.session){

            console.log(
                "Sessão existente:",
                data.session.user
            );

            abrirSistema(
                data.session.user
            );

        }

    }catch(error){

        console.error(
            "Erro sessão:",
            error
        );

    }

}


/* =====================================================
   OBSERVAR ALTERAÇÕES DA SESSÃO
===================================================== */

supabaseClient.auth.onAuthStateChange(
    function(event,session){

        console.log(
            "Auth event:",
            event
        );

        if(event === "SIGNED_IN" && session){

            abrirSistema(
                session.user
            );

        }

    }
);


/* =====================================================
   SAIR
===================================================== */

async function sair(){

    try{

        await supabaseClient.auth.signOut();

    }catch(error){

        console.error(error);

    }

    sistema.style.display =
        "none";

    login.style.display =
        "block";

    senhaInput.value = "";

}


/* =====================================================
   INICIALIZAR
===================================================== */

verificarSessao();

</script>

</body>
    </html>
