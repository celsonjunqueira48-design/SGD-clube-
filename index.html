nav button:hover,nav button.active{background:#fff2}.section{font-size:11px;opacity:.7;margin:12px}
main{flex:1;padding:25px;max-width:1450px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}

<script>
let client;
let db={membros:[],unidades:[],atividades:[],financas:[],config:{}};
const $=s=>document.querySelector(s);

async function supa(){
if(!client)client=supabase.createClient(window.SGD_SUPABASE_URL,window.SGD_SUPABASE_ANON_KEY);
return client;
}

function esc(v){return String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function money(v){return Number(v||0).toLocaleString("pt-AO",{minimumFractionDigits:2})}
function btn(t,c="primary",f=""){return `<button class="btn ${c}" onclick="${f}">${t}</button>`}
function top(h,s,b=""){return `<div class="top"><div><h1>${h}</h1><p class="muted">${s}</p></div>${b}</div>`}
function field(n,l,t="text",r=false){return `<div class="field"><label>${l}</label><input name="${n}" type="${t}" ${r?"required":""}></div>`}
function select(n,l,a,r=false){return `<div class="field"><label>${l}</label><select name="${n}" ${r?"required":""}><option value="">Selecionar</option>${a.map(x=>`<option value="${esc(x.value??x)}">${esc(x.label??x)}</option>`).join("")}</select></div>`}

async function load(){
const c=await supa();
const results=await Promise.all([
c.from("membros").select("*").order("created_at",{ascending:true}),
c.from("unidades").select("*").order("nome"),
c.from("atividades").select("*").order("data",{ascending:false}),
c.from("financas").select("*").order("data",{ascending:false})
]);
db.membros=results[0].error?[]:results[0].data||[];
db.unidades=results[1].error?[]:results[1].data||[];
db.atividades=results[2].error?[]:results[2].data||[];
db.financas=results[3].error?[]:results[3].data||[];
return db;
}

async function refresh(){
try{return await load()}catch(e){console.error(e);return db}
}

function page(p){
document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===p));
if(pages[p])pages[p]();
}

async function dashboard(){
await refresh();
let r=db.financas.filter(x=>x.tipo==="Receita").reduce((a,x)=>a+Number(x.valor||0),0);
let d=db.financas.filter(x=>x.tipo==="Despesa").reduce((a,x)=>a+Number(x.valor||0),0);
$("#content").innerHTML=top("Dashboard","Visão geral do clube",btn("+ Cadastrar membro","primary","page('membroForm')"))+
`<div class="cards">
<div class="card"><b>👥 Membros</b><h2>${db.membros.length}</h2></div>
<div class="card"><b>🏕️ Unidades</b><h2>${db.unidades.length}</h2></div>
<div class="card"><b>📅 Atividades</b><h2>${db.atividades.length}</h2></div>
<div class="card"><b>💰 Saldo</b><h2>${money(r-d)} Kz</h2></div>
</div>
<div class="card"><h3>Acesso rápido</h3>${btn("Membros","light","page('membros')")} ${btn("Unidades","light","page('unidades')")} ${btn("Finanças","light","page('financas')")}</div>`;
}

async function membros(){
await refresh();
$("#content").innerHTML=top("Membros","Pesquisa e cadastro dos desbravadores",btn("+ Cadastrar membro","primary","page('membroForm')"))+
`<div class="card"><div class="toolbar"><input id="search" placeholder="Pesquisar nome ou Nº..." oninput="renderMembers()"></div>
<div style="overflow:auto"><table><thead><tr><th>Foto</th><th>Nº</th><th>Nome</th><th>Unidade</th><th>Função</th><th>Classe</th><th>Estado</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>`;
renderMembers();
}

function renderMembers(){
let q=($("#search")?.value||"").toLowerCase();
let arr=db.membros.filter(m=>`${m.nome||""} ${m.numero_membro||""}`.toLowerCase().includes(q));
$("#rows").innerHTML=arr.map(m=>{
let u=db.unidades.find(x=>x.id===m.unidade_id);
return `<tr>
<td>${m.foto_url?`<img class="member-photo" src="${esc(m.foto_url)}">`:`<div class="member-photo"></div>`}</td>
<td><b>${esc(m.numero_membro)}</b></td>
<td>${esc(m.nome)}</td>
<td>${esc(u?.nome||"—")}</td>
<td>${esc(m.funcao||"—")}</td>
<td>${esc(m.classe||"—")}</td>
<td><span class="badge">${esc(m.estado||"Ativo")}</span></td>
<td>${btn("Ver","light",`profile('${m.id}')`)}</td>
</tr>`}).join("")||`<tr><td colspan="8">Nenhum membro encontrado.</td></tr>`;
}

function gerarNumero(){
let ano=new Date().getFullYear(),maior=0;
db.membros.forEach(m=>{let x=String(m.numero_membro||"").match(/(\d+)$/);if(x)maior=Math.max(maior,Number(x[1]))});
return `DBV-${ano}-${String(maior+1).padStart(4,"0")}`;
}
function gerarUtilizador(){return "m"+Date.now().toString().slice(-6)}
function gerarSenha(){return Math.random().toString(36).slice(-8).toUpperCase()}

async function membroForm(){
await refresh();
let unidades=db.unidades.filter(u=>u.estado!=="Inativa");
$("#content").innerHTML=top("Cadastrar membro","Novo desbravador",btn("← Voltar","light","page('membros')"))+
`<form id="mf">
<div class="card"><h3>Dados pessoais</h3><div class="grid">
${field("nome","Nome completo *","text",true)}
${field("nascimento","Data de nascimento","date")}
${select("sexo","Sexo",["Masculino","Feminino","Outro"])}
${field("documento","Nº do documento")}
${field("telefone","Telefone")}
${field("endereco","Endereço")}
${field("data_cadastro","Data de cadastro","date",true)}
</div></div>
<div class="card"><h3>Dados do clube</h3><div class="grid">
${select("unidade_id","Unidade",unidades.map(u=>({value:u.id,label:u.nome})))}
${select("funcao","Função",["Desbravador","Conselheiro","Vice-conselheiro","Diretor","Secretário","Tesoureiro","Capelão"])}
${select("classe","Classe",["Amigo","Companheiro","Pesquisador","Pioneiro","Excursionista","Guia"])}
${select("estado","Estado",["Ativo","Inativo","Suspenso"])}
</div></div>
<div class="card"><h3>Família e escola</h3><div class="grid">
${field("pai","Nome do pai")}${field("mae","Nome da mãe")}
${field("encarregado","Nome do encarregado")}${field("contacto_encarregado","Contacto do encarregado")}
${field("escola","Escola")}${field("classe_escolar","Classe escolar")}
</div></div>
<div class="card"><h3>Fotografia</h3><div class="field"><label>Foto do membro</label><input name="foto" type="file" accept="image/*"></div></div>
<div class="actions"><button class="btn primary">Cadastrar membro</button></div>
</form>`;
$('[name=data_cadastro]').value=new Date().toISOString().slice(0,10);

$("#mf").onsubmit=async e=>{
e.preventDefault();
let d=Object.fromEntries(new FormData(e.target)),foto=e.target.foto.files[0];
delete d.foto;
d.numero_membro=gerarNumero();
d.utilizador=gerarUtilizador();
try{
const c=await supa();
if(foto){
let ext=foto.name.split(".").pop().toLowerCase();
let path=`${d.numero_membro}-${Date.now()}.${ext}`;
let up=await c.storage.from("fotos_membros").upload(path,foto,{upsert:true,contentType:foto.type});
if(up.error)throw up.error;
let pub=c.storage.from("fotos_membros").getPublicUrl(path);
d.foto_url=pub.data.publicUrl;
}
let res=await c.from("membros").insert([d]).select().single();
if(res.error)throw res.error;
alert(`Membro cadastrado!\nNº: ${d.numero_membro}\nUtilizador: ${d.utilizador}`);
await profile(res.data.id,true);
}catch(err){console.error(err);alert("Erro ao cadastrar membro: "+err.message)}
};
}

let u=db.unidades.find(x=>x.id===m.unidade_id);

`<div class="card">
<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
${m.foto_url?`<img class="profile-photo" src="${esc(m.foto_url)}">`:`<div class="profile-photo"></div>`}
<div><h2>${esc(m.nome)}</h2><p><b>Nº:</b> ${esc(m.numero_membro)}</p><p><b>Utilizador:</b> ${esc(m.utilizador||"—")}</p></div>
</div><hr>
<div class="grid">
<p><b>Unidade:</b> ${esc(u?.nome||"—")}</p><p><b>Função:</b> ${esc(m.funcao||"—")}</p>
<p><b>Classe:</b> ${esc(m.classe||"—")}</p><p><b>Estado:</b> ${esc(m.estado||"—")}</p>
<p><b>Nascimento:</b> ${esc(m.nascimento||"—")}</p><p><b>Sexo:</b> ${esc(m.sexo||"—")}</p>
<p><b>Telefone:</b> ${esc(m.telefone||"—")}</p><p><b>Documento:</b> ${esc(m.documento||"—")}</p>
<p><b>Endereço:</b> ${esc(m.endereco||"—")}</p><p><b>Escola:</b> ${esc(m.escola||"—")}</p>
<p><b>Classe escolar:</b> ${esc(m.classe_escolar||"—")}</p><p><b>Encarregado:</b> ${esc(m.encarregado||"—")}</p>
<p><b>Contacto:</b> ${esc(m.contacto_encarregado||"—")}</p><p><b>Pai:</b> ${esc(m.pai||"—")}</p>
<p><b>Mãe:</b> ${esc(m.mae||"—")}</p>
</div></div>
<div class="actions">${btn("✏️ Editar","light",`editMember('${m.id}')`)}${btn("📄 Imprimir A4","light",`printA4('${m.id}')`)}${btn("🖨️ Térmica","light",`printThermal('${m.id}')`)}</div>`;
}

async function editMember(id){
await refresh();let m=db.membros.find(x=>x.id===id);
$("#content").innerHTML=top("Editar membro","Alterar cadastro",btn("← Voltar","light",`profile('${id}')`))+

${field("numero_membro","Nº do membro", "text",true)}
${field("nome","Nome completo","text",true)}
${field("nascimento","Nascimento","date")}${field("telefone","Telefone")}

`<div class="card"><table><thead><tr><th>Unidade</th><th>Responsável</th><th>Membros</th><th>Estado</th><th></th></tr></thead><tbody>
${db.unidades.map(u=>`<tr><td>${esc(u.nome)}</td><td>${esc(u.responsavel||"—")}</td><td>${db.membros.filter(m=>m.unidade_id===u.id).length}</td><td>${esc(u.estado||"")}</td><td>${btn("Editar","light",`unitForm('${u.id}')`)}</td></tr>`).join("")}</tbody></table></div>`;

async function conta(){
let c=await supa(),r=await c.auth.getUser(),email=r.data?.user?.email||"";
$("#content").innerHTML=top("Minha conta","Credenciais de acesso")+`<div class="card"><h3>Conta atual</h3><p><b>E-mail:</b> ${esc(email)}</p></div>
<div class="card"><h3>Alterar palavra-passe</h3><form id="pw">${field("senha","Nova palavra-passe","password",true)}${field("conf","Confirmar","password",true)}<button class="btn primary">Alterar</button></form></div>`;
$("#pw").onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(d.senha!==d.conf)return alert("As palavras-passe não coincidem.");let x=await c.auth.updateUser({password:d.senha});if(x.error)alert(x.error.message);else alert("Palavra-passe alterada com sucesso.")};
}

function printA4(id){
let m=db.membros.find(x=>x.id===id),u=db.unidades.find(x=>x.id===m.unidade_id),w=open("","_blank");
w.document.write(`<html><body style="font-family:Arial;margin:25mm"><h1 style="text-align:center">FICHA DE CADASTRO</h1>${m.foto_url?`<img src="${m.foto_url}" style="width:120px;height:120px;object-fit:cover">`:""}<hr>${Object.entries({"Nº":m.numero_membro,"Nome":m.nome,"Nascimento":m.nascimento,"Unidade":u?.nome,"Função":m.funcao,"Classe":m.classe,"Estado":m.estado,"Telefone":m.telefone,"Documento":m.documento,"Endereço":m.endereco,"Encarregado":m.encarregado,"Contacto":m.contacto_encarregado,"Escola":m.escola,"Data":m.data_cadastro}).map(x=>`<p><b>${x[0]}:</b> ${esc(x[1]||"—")}</p>`).join("")}<script>setTimeout(()=>print(),400)<\/script></body></html>`);
w.document.close();
}

$("#loginForm").onsubmit=async e=>{
e.preventDefault();
let d=Object.fromEntries(new FormData(e.target)),er=$("#loginError");
er.classList.add("hidden");
try{
let r=await (await supa()).auth.signInWithPassword({email:d.email.trim(),password:d.password});
if(r.error)throw r.error;
$("#login").classList.add("hidden");$("#app").classList.remove("hidden");await page("dashboard");
}catch(x){console.error(x);er.textContent="Erro ao iniciar sessão: "+x.message;er.classList.remove("hidden")}
};

(async()=>{
try{
let c=await supa(),r=await c.auth.getSession();
if(r.data.session){$("#login").classList.add("hidden");$("#app").classList.remove("hidden");await page("dashboard")}
}catch(e){console.error(e)}
})();
</script>
