<script>


/* =========================
   VARIÁVEIS
========================= */

let client = null;

let db = {

membros:[],
unidades:[],
atividades:[],
financas:[],
config:{}

};

const $ = s =>
document.querySelector(s);

const content =
document.querySelector("#content");



/* =========================
   SUPABASE
========================= */

async function initSupabase(){

if(!window.supabase){

throw new Error(
"Supabase não carregou."
);

}

if(!client){

client =
window.supabase.createClient(
window.SGD_SUPABASE_URL,
window.SGD_SUPABASE_ANON_KEY
);

}

return client;

}



/* =========================
   ESCAPE
========================= */

function esc(x){

return String(x ?? "")
.replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m]));

}



/* =========================
   DINHEIRO
========================= */

function money(v){

return Number(v || 0)
.toLocaleString(
"pt-AO",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}



/* =========================
   BOTÃO
========================= */

function B(t,c="primary",fn=""){

return `
<button
class="btn ${c}"
onclick="${fn}"
>
${t}
</button>
`;

}



/* =========================
   TOPO
========================= */

function T(h,s,b=""){

return `
<div class="top">

<div>

<h1>
${h}
</h1>

<p class="muted">
${s}
</p>

</div>

${b}

</div>
`;

}

   FIELD
========================= */

function field(
n,
l,
t="text",
req=false
){

return `

${l}

<input
name="${n}"
type="${t}"
${req ? "required" : ""}
>

</div>
`;

}



/* =========================
   SELECT
========================= */

function select(
n,
l,
arr,
req=false
){

return `
<div class="field">

<label>
${l}
</label>

<select
name="${n}"
${req ? "required" : ""}
>

<option value="">
Selecionar
</option>

${arr.map(x=>`

<option value="${esc(x)}">
${esc(x)}
</option>

`).join("")}

</select>

</div>
`;

}



/* =========================
   CARREGAR BANCO
========================= */

async function loadDB(){

const c =
await initSupabase();


/*
 * Cada consulta é independente.
 * Assim, se uma tabela der erro,
 * conseguimos saber exatamente qual.
 */


const membros =
await c
.from("membros")
.select("*")
.order(
"created_at",
{ascending:false}
);


if(membros.error){

throw new Error(
"Erro na tabela membros: "+
membros.error.message
);

}


const unidades =
await c
.from("unidades")
.select("*")
.order("nome");


if(unidades.error){

throw new Error(
"Erro na tabela unidades: "+
unidades.error.message
);

}


let atividades =
await c
.from("atividades")
.select("*")
.order(
"data",
{ascending:false}
);


if(atividades.error){

/*
 * Atividades não impede o sistema
 * de abrir.
 */

console.warn(
"Atividades:",
atividades.error.message
);

atividades.data=[];

}


let financas =
await c
.from("financas")
.select("*")
.order(
"data",
{ascending:false}
);


if(financas.error){

console.warn(
"Finanças:",
financas.error.message
);

financas.data=[];

}


let configuracoes =
await c
.from("configuracoes")
.select("*")
.limit(1);


if(configuracoes.error){

console.warn(
"Configurações:",
configuracoes.error.message
);

configuracoes.data=[];

}


db.membros =
membros.data || [];

db.unidades =
unidades.data || [];

db.atividades =
atividades.data || [];

db.financas =
financas.data || [];

db.config =
configuracoes.data?.[0] || {

nome_clube:
"Clube de Desbravadores",

papel:"58 mm",

ficha:"A4"

};


return db;

}



/* =========================
   REFRESH
========================= */

async function refresh(){

try{

await loadDB();

return true;

}catch(e){

console.error(e);

return false;

}

}



/* =========================
   NÚMERO AUTOMÁTICO
========================= */

function nextNumber(){

let year =
new Date()
.getFullYear();

let max=0;

db.membros.forEach(m=>{

let n =
String(
m.numero_membro || ""
);

let match =
n.match(
/DBV-\d{4}-(\d+)/
);

if(match){

max =
Math.max(
max,
Number(match[1])
);

}

});

return `
DBV-${year}-${
String(max+1).padStart(4,"0")
}
`;

}



/* =========================
   UTILIZADOR AUTOMÁTICO
========================= */

function nextUsername(){

let max=0;

db.membros.forEach(m=>{

let u =
String(
m.utilizador || ""
);

let match =
u.match(/^m(\d+)$/i);

if(match){

max =
Math.max(
max,
Number(match[1])
);

}

});

return `
m${String(max+1).padStart(4,"0")}
`;

}



/* =========================
   PASSWORD AUTOMÁTICA
========================= */

function generatePassword(){

const chars =
"ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

let password="";

for(
let i=0;
i<8;
i++
){

password +=
chars[
Math.floor(
Math.random()*chars.length
)
];

}

return password;

}

/* =========================
   TABELA MEMBROS
========================= */

function renderMemberTable(){

let q =
(
$("#search")?.value || ""
)
.toLowerCase();


let arr =
db.membros.filter(m=>{

let text = `

${m.nome||""}
${m.numero_membro||""}
${m.utilizador||""}
${m.telefone||""}

`.toLowerCase();

return text.includes(q);

});


const rows =
$("#memberRows");


if(!rows){

return;

}


rows.innerHTML =

arr.map(m=>{

let unidade =
db.unidades.find(
u=>u.id===m.unidade_id
);


let photo =
m.foto_url
?

`
<img
src="${esc(m.foto_url)}"
class="member-photo"
alt="Foto"
>
`

:

`

<div class="empty-photo">
👤
</div>

`;


return `

<tr>

<td>
${photo}
</td>

<td>

<b>
${esc(m.numero_membro)}
</b>

</td>

<td>

<b>
${esc(m.nome)}
</b>

<br>

<small class="muted">
${esc(m.utilizador||"")}
</small>

</td>

<td>
${esc(unidade?.nome||"—")}
</td>

<td>
${esc(m.funcao||"—")}
</td>

<td>
${esc(m.classe||"—")}
</td>

<td>
${esc(m.telefone||"—")}
</td>

<td>

<span class="badge">
${esc(m.estado||"Ativo")}
</span>

</td>

<td>

${B(
"Abrir",
"light",
`profile('${m.id}')`
)}

</td>

</tr>

`;

}).join("")

||

`

<tr>

<td
colspan="9"
class="muted"
>

Nenhum membro encontrado.

</td>

</tr>

`;

}

$('[name=data_cadastro]')
.value =
new Date()
.toISOString()
.slice(0,10);


$('[name=estado]')
.value="Ativo";


$("#mf").onsubmit =
async e=>{

e.preventDefault();


const button =
e.target.querySelector(
'button[type="submit"]'
);

button.disabled=true;

button.textContent=
"Cadastrando...";


try{

let form =
new FormData(e.target);


let d =
Object.fromEntries(form);


/*
 * Foto
 */

let file =
e.target.querySelector(
'[name="foto"]'
).files[0];


delete d.foto;


/*
 * GERAR CREDENCIAIS
 */

d.numero_membro =
nextNumber();

d.utilizador =
nextUsername();


let senha =
generatePassword();


/*
 * Se a coluna senha existir,
 * guarda a senha.
 */

d.palavra_passe =
senha;


/*
 * FOTO
 */

if(file){

const c =
await initSupabase();


let ext =
file.name
.split(".")
.pop()
.toLowerCase();


let path =
`${d.numero_membro}-${Date.now()}.${ext}`;


const upload =
await c.storage
.from("fotos_membros")
.upload(
path,
file,
{
upsert:false
}
);


if(upload.error){

throw new Error(
"Erro ao enviar fotografia: "+
upload.error.message
);

}


const publicUrl =
c.storage
.from("fotos_membros")
.getPublicUrl(path);


d.foto_url =
publicUrl.data.publicUrl;

}


const c =
await initSupabase();


/*
 * IMPORTANTE:
 * unidade_id é UUID.
 * Não enviamos unidade como texto.
 */

const insert =
await c
.from("membros")
.insert([d])
.select()
.single();


if(insert.error){

throw insert.error;

}


db.membros.push(
insert.data
);


alert(

"Membro cadastrado com sucesso!\n\n"+
"Nº: "+d.numero_membro+
"\nUtilizador: "+d.utilizador+
"\nPalavra-passe: "+senha

);


profile(
insert.data.id,
true,
d.utilizador,
senha
);


}catch(err){

console.error(err);

alert(
"Erro ao cadastrar membro:\n\n"+
err.message
);

}finally{

button.disabled=false;

button.textContent=
"Cadastrar membro";

}

};

}
