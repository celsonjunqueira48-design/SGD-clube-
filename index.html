}

};


const $=s=>document.querySelector(s);

function save(){

localStorage.setItem(
STORAGE,
JSON.stringify(db)

}


function esc(x){

return String(x??"")
.replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

}


function money(v){

return Number(v||0)
.toLocaleString(
"pt-AO",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}


function nextNumber(){

return "DBV-"+
new Date().getFullYear()+
"-"+
String(db.nextMember)
.padStart(4,"0");

}


function B(t,c="primary",fn=""){

return `<button class="btn ${c}" onclick="${fn}">${t}</button>`;

}


function T(h,s,b=""){

return `<div class="top">

<div>

<h1>${h}</h1>

<p class=muted>${s}</p>

</div>

${b}

</div>`;

}


function field(n,l,t="text",req=false){

return `<div class=field>

<label>${l}</label>

<input
name="${n}"
type="${t}"
${req?"required":""}
>

</div>`;

}


function select(n,l,arr,req=false){

return `<div class=field>

<label>${l}</label>

<select
name="${n}"
${req?"required":""}
>

<option value="">
Selecionar
</option>

${arr.map(x=>
`<option>${esc(x)}</option>`
).join("")}

</select>

</div>`;

}


function page(p){

document
.querySelectorAll("nav button")
.forEach(
b=>b.classList.toggle(
"active",
b.dataset.page===p
)
);

pages[p]();

}

function renderMemberTable(){

let q=
($("#search")?.value||"")
.toLowerCase();

let arr=
db.membros.filter(
m=>
(m.nome+" "+m.numero)
.toLowerCase()
.includes(q)
);


$("#memberRows").innerHTML=

arr.map(
m=>{

let i=db.membros.indexOf(m);

return `<tr>

<td>
<b>${esc(m.numero)}</b>
</td>

<td>
${esc(m.nome)}
</td>

<td>
${esc(m.unidade||"—")}
</td>

<td>
${esc(m.funcao||"—")}
</td>

<td>
${esc(m.classe||"—")}
</td>

<td>
${esc(m.telefone||"—")}
</td>

<td>
<span class=badge>
${esc(m.estado)}
</span>
</td>

<td>
${B(
"Abrir",
"light",
`profile(${i})`
)}
</td>

</tr>`;

}
).join("") ||

`<tr>
<td colspan=8 class=muted>
Nenhum membro encontrado.
</td>
</tr>`;

}

${field(

"password",
true
)}

${field(

"password",
true
)}

${field(

"password",
true
)}


<div
id=passwordMessage
class="notice hidden">
</div>


<div class=actions>

<button class="btn primary">

Alterar palavra-passe

</button>

</div>

</form>

</div>


<div class=card>

<h3>
📧 Alterar e-mail
</h3>

<p class=muted>

Depois da alteração, poderá ser necessário confirmar o novo e-mail através da mensagem enviada pelo Supabase.

</p>


<form id=emailForm>

${field(
"newEmail",
"Novo e-mail",
"email",
true
)}


<div
id=emailMessage
class="notice hidden">
</div>


<div class=actions>

<button class="btn primary">

Alterar e-mail

</button>

</div>

</form>

</div>
`;


/* ALTERAR SENHA */

$("#passwordForm").onsubmit =
async e=>{

e.preventDefault();

const d=
Object.fromEntries(
new FormData(e.target)
);

const msg=
$("#passwordMessage");

msg.className=
"notice hidden";

msg.textContent="";


if(
d.newPassword.length<6
){

msg.textContent=
"A nova palavra-passe deve ter pelo menos 6 caracteres.";

msg.className=
"notice error";

return;

}


if(
d.newPassword !==
d.confirmPassword
){

msg.textContent=
"As novas palavras-passe não coincidem.";

msg.className=
"notice error";

return;

}


try{

const c=
await SGD_CENTRAL.init();


/*
Confirma a palavra-passe atual
*/

const {
error:loginError
}=
await c.auth.signInWithPassword({

email:emailAtual,

password:d.currentPassword

});


if(loginError){

throw new Error(
"A palavra-passe atual está incorreta."
);

}


/*
Atualiza a palavra-passe
*/

const {
error
}=
await c.auth.updateUser({

password:d.newPassword

});


if(error)
throw error;


msg.textContent=
"Palavra-passe alterada com sucesso.";

msg.className=
"notice";


e.target.reset();


}catch(err){

msg.textContent=
err.message||
"Não foi possível alterar a palavra-passe.";

msg.className=
"notice error";

}

};


/* ALTERAR EMAIL */

$("#emailForm").onsubmit =
async e=>{

e.preventDefault();

const d=
Object.fromEntries(
new FormData(e.target)
);

const msg=
$("#emailMessage");

msg.className=
"notice hidden";

msg.textContent="";


if(
d.newEmail.trim().toLowerCase()
===
emailAtual.toLowerCase()
){

msg.textContent=
"Este já é o seu e-mail atual.";

msg.className=
"notice error";

return;

}


try{

const c=
await SGD_CENTRAL.init();


const {
error
}=
await c.auth.updateUser({

email:
d.newEmail.trim()

});


if(error)
throw error;


msg.textContent=
"Pedido enviado. Verifique o novo e-mail para confirmar a alteração.";

msg.className=
"notice";


e.target.reset();


}catch(err){

msg.textContent=
err.message||
"Não foi possível alterar o e-mail.";

msg.className=
"notice error";

}

};

}
