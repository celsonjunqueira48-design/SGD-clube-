<script>

/* =====================================================
   CONFIGURAÇÃO SUPABASE
===================================================== */

const SUPABASE_URL =
"https://edttbjysaqdounpghsdn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-pb2KXvmOPN8FbZLdCgeFg_5Me7Y0V2";

const supabaseClient =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =====================================================
   VARIÁVEIS
===================================================== */

let membros=[];
let unidades=[];
let atividades=[];
let financas=[];

const content =
document.getElementById("content");


/* =====================================================
   UTILITÁRIOS
===================================================== */

function esc(value){

 return String(value ?? "")
 .replace(/[&<>"']/g,function(x){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[x];
 });

}


function money(value){

 return Number(value || 0)
 .toLocaleString("pt-AO",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 });

}


function errorMessage(message){

 alert(message);

}


/* =====================================================
   CARREGAR DADOS
===================================================== */

async function carregarDados(){

 try{

  const m =
  await supabaseClient
  .from("membros")
  .select("*");

  if(!m.error)
   membros=m.data || [];

  const u =
  await supabaseClient
  .from("unidades")
  .select("*");

  if(!u.error)
   unidades=u.data || [];

  const a =
  await supabaseClient
  .from("atividades")
  .select("*");

  if(!a.error)
   atividades=a.data || [];

  const f =
  await supabaseClient
  .from("financas")
  .select("*");

  if(!f.error)
   financas=f.data || [];

 }catch(e){

  console.error(e);

 }

}


/* =====================================================
   DASHBOARD
===================================================== */

async function dashboard(){

 await carregarDados();

 let receitas=financas
 .filter(x=>x.tipo==="Receita")
 .reduce((a,x)=>a+Number(x.valor||0),0);

 let despesas=financas
 .filter(x=>x.tipo==="Despesa")
 .reduce((a,x)=>a+Number(x.valor||0),0);

 content.innerHTML=`

 <p class="muted">

 </p>
 </div>

 + Cadastrar membro
 </button>

 </div>


 <div class="cards">

 <div class="card stat">
 👥 Membros
 <strong>${membros.length}</strong>
 </div>

 <div class="card stat">
 🏕️ Unidades
 <strong>${unidades.length}</strong>
 </div>

 <div class="card stat">
 📅 Atividades
 <strong>${atividades.length}</strong>
 </div>

 <div class="card stat">
 💰 Saldo
 <strong>${money(receitas-despesas)} Kz</strong>
 </div>

 </div>


 <div class="card">

 <h3>Acesso rápido</h3>

 <div class="actions" style="justify-content:flex-start">

 <button class="btn light"
 onclick="showPage('membros')">
 👥 Membros
 </button>

 <button class="btn light"
 onclick="showPage('unidades')">
 🏕️ Unidades
 </button>

 <button class="btn light"
 onclick="showPage('atividades')">
 📅 Atividades
 </button>

 <button class="btn light"
 onclick="showPage('financas')">
 💰 Finanças
 </button>

 </div>

 </div>

 `;

}


/* =====================================================
   MEMBROS
===================================================== */

async function membrosPage(){

 await carregarDados();

 content.innerHTML=`

 <div class="top">

 <div>
 <h1>Membros</h1>
 <p class="muted">
 Lista dos membros cadastrados
 </p>
 </div>

 <button class="btn primary"
 onclick="showPage('membroForm')">
 + Cadastrar membro
 </button>

 </div>


 <div class="card">

 <div class="toolbar">

 <input
 id="pesquisaMembro"
 placeholder="Pesquisar membro..."
 oninput="filtrarMembros()">

 </div>


 <div style="overflow:auto">

 <table>

 <thead>

 <tr>
 <th>Nome</th>
 <th>Unidade</th>
 <th>Função</th>
 <th>Classe</th>
 <th>Telefone</th>
 <th>Estado</th>
 </tr>

 </thead>

 <tbody id="listaMembros"></tbody>

 </table>

 </div>

 </div>

 `;

 renderMembros();

}


function renderMembros(){

 const busca =
 (document.getElementById("pesquisaMembro")?.value || "")
 .toLowerCase();

 const lista =
 membros.filter(m=>{

  return (
   String(m.nome||"")
   .toLowerCase()
   .includes(busca)
  );

 });


 const tbody =
 document.getElementById("listaMembros");

 if(!tbody)return;

 tbody.innerHTML =
 lista.map(m=>`

 <tr>

 <td>
 <b>${esc(m.nome||"—")}</b>
 </td>

 <td>${esc(m.unidade||"—")}</td>

 <td>${esc(m.funcao||"—")}</td>

 <td>${esc(m.classe||"—")}</td>

 <td>${esc(m.telefone||"—")}</td>

 <td>
 <span class="badge">
 ${esc(m.estado||"Ativo")}
 </span>
 </td>

 </tr>

 `).join("")
 ||
 `<tr>
 <td colspan="6" class="muted">
 Nenhum membro encontrado.
 </td>
 </tr>`;

}


function filtrarMembros(){

 renderMembros();

}

 <input name="classe_escolar">

async function cadastrarMembro(event){

 event.preventDefault();

 const form=event.target;

 const dados=
 Object.fromEntries(
  new FormData(form)
 );


 /*
  IMPORTANTE:
  Não criamos "numero" aqui porque
  a tua tabela mostrou que essa coluna
  não existe.
 */

 try{

  const {data,error}=
  await supabaseClient
  .from("membros")
  .insert([dados])
  .select()
  .single();

  if(error)throw error;

  alert("Membro cadastrado com sucesso!");

  showPage("membros");

 }catch(error){

  console.error(error);

  alert(
   "Erro ao cadastrar membro:\n"+
   error.message
  );

 }

}

async function showPage(nome){

 document
 .querySelectorAll("nav button")
 .forEach(btn=>{

  btn.classList.toggle(
   "active",
   btn.dataset.page===nome
  );

 });

 if(paginas[nome]){

  try{

   await paginas[nome]();

  }catch(error){

   console.error(error);

   content.innerHTML=`
   <div class="card error">
   Erro ao carregar esta página:
   ${esc(error.message)}
   </div>
   `;

  }

 }

}


/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginForm")
.addEventListener("submit",async function(e){

 e.preventDefault();

 const email=
 document.getElementById("email")
 .value.trim();

 const password=
 document.getElementById("password")
 .value;

 const errorBox=
 document.getElementById("loginError");

 errorBox.classList.add("hidden");

 try{

  const {data,error}=
  await supabaseClient.auth
  .signInWithPassword({
   email:email,
   password:password
  });

  if(error)throw error;

  document
  .getElementById("loginScreen")
  .classList.add("hidden");

  document
  .getElementById("app")
  .classList.remove("hidden");

  await showPage("dashboard");

 }catch(error){

  console.error(error);

  errorBox.textContent=
  "Não foi possível entrar: "+
  error.message;

  errorBox.classList.remove("hidden");

 }

});

}


/* =====================================================
   VERIFICAR SESSÃO
===================================================== */

(async function(){

 try{

  const {data,error}=
  await supabaseClient.auth.getSession();

  if(error)throw error;

  if(data.session){

   document
   .getElementById("loginScreen")
   .classList.add("hidden");

   document
   .getElementById("app")
   .classList.remove("hidden");

   await showPage("dashboard");

  }

 }catch(error){

  console.error(
   "Erro ao verificar sessão:",
   error
  );

 }

})();

</script>
