<script>

let supabaseClient;

const db = {
    membros:[],
    unidades:[],
    atividades:[],
    financas:[],
    configuracoes:null
};

const content =
document.getElementById("content");


/* =================================
   SUPABASE
================================= */

function getClient(){

    if(!supabaseClient){

        if(!window.supabase){

            throw new Error(
                "Biblioteca do Supabase não carregou."
            );

        }

        supabaseClient =
        window.supabase.createClient(
            window.SGD_SUPABASE_URL,
            window.SGD_SUPABASE_ANON_KEY
        );
    }

    return supabaseClient;
}


/* =================================
   UTILITÁRIOS
================================= */

function esc(value){

    return String(value ?? "")
    .replace(/[&<>"']/g, function(m){

        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[m];

    });
}


function money(value){

    return Number(value || 0)
    .toLocaleString("pt-AO",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });
}


function showError(message){

    console.error(message);

    alert(message);
}


function getToday(){

    return new Date()
    .toISOString()
    .slice(0,10);

}


function randomPassword(){

    const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

    let result = "";

    for(let i=0;i<8;i++){

        result +=
        chars[Math.floor(Math.random()*chars.length)];

    }

    return result;

}


function generateNumber(){

    const year =
    new Date().getFullYear();

    const number =
    db.membros.length + 1;

    return "DBV-" +
    year +
    "-" +
    String(number).padStart(4,"0");

}


function generateUsername(){

    return "membro" +
    String(db.membros.length + 1)
    .padStart(4,"0");

}


function B(text,cls="primary",fn=""){

    return `
    <button
        type="button"
        class="btn ${cls}"
        onclick="${fn}">
        ${text}
    </button>
    `;

}


function top(title,subtitle="",button=""){

    return `
    <div class="top">

        <div>
            <h1>${title}</h1>
            <p class="muted">${subtitle}</p>
        </div>

        <div>
            ${button}
        </div>

    </div>
    `;

}


function field(name,label,type="text",required=false){

    return `
    <div class="field">

        <label>${label}</label>

        <input
            name="${name}"
            type="${type}"
            ${required ? "required" : ""}
        >

    </div>
    `;

}


function selectField(name,label,options,required=false){

    return `
    <div class="field">

        <label>${label}</label>

        <select
            name="${name}"
            ${required ? "required" : ""}>

            <option value="">
                Selecionar
            </option>

            ${options.map(option => `
                <option value="${esc(option.value ?? option)}">
                    ${esc(option.label ?? option)}
                </option>
            `).join("")}

        </select>

    </div>
    `;

}


/* =================================
   CARREGAR DADOS
================================= */

async function loadData(){

    const c = getClient();

    /*
       IMPORTANTE:
       Cada tabela é carregada separadamente.
       Assim, se uma falhar, o login não é bloqueado.
    */

    try{

        const r =
        await c
        .from("membros")
        .select("*")
        .order("created_at",{ascending:false});

        if(!r.error){

            db.membros =
            r.data || [];

        }else{

            console.error(
                "Erro membros:",
                r.error
            );

        }

    }catch(e){

        console.error(e);

    }


    try{

        const r =
        await c
        .from("unidades")
        .select("*")
        .order("nome");

        if(!r.error){

            db.unidades =
            r.data || [];

        }else{

            console.error(
                "Erro unidades:",
                r.error
            );

        }

    }catch(e){

        console.error(e);

    }


    try{

        const r =
        await c
        .from("atividades")
        .select("*")
        .order("data",{ascending:false});

        if(!r.error){

            db.atividades =
            r.data || [];

        }else{

            console.error(
                "Erro atividades:",
                r.error
            );

        }

    }catch(e){

        console.error(e);

    }


    try{

        const r =
        await c
        .from("financas")
        .select("*")
        .order("data",{ascending:false});

        if(!r.error){

            db.financas =
            r.data || [];

        }else{

            console.error(
                "Erro finanças:",
                r.error
            );

        }

    }catch(e){

        console.error(e);

    }


    try{

        const r =
        await c
        .from("configuracoes")
        .select("*")
        .limit(1);

        if(!r.error){

            db.configuracoes =
            r.data?.[0] || null;

        }

    }catch(e){

        console.error(e);

    }

}


/* =================================
   LOGIN
================================= */

document
.getElementById("loginForm")
.addEventListener("submit",async function(e){

    e.preventDefault();

    const button =
    document.getElementById("loginButton");

    const errorBox =
    document.getElementById("loginError");

    errorBox.classList.add("hidden");

    button.disabled = true;

    button.textContent =
    "A entrar...";

    const form =
    new FormData(e.target);

    const email =
    String(form.get("email") || "")
    .trim();

    const password =
    String(form.get("password") || "");

    try{

        const c =
        getClient();

        const result =
        await c.auth.signInWithPassword({
            email:email,
            password:password
        });

        if(result.error){

            throw result.error;

        }

        /*
          MUITO IMPORTANTE:
          Primeiro mostramos a aplicação.
          Não esperamos o banco de dados.
        */

        document
        .getElementById("loginScreen")
        .classList.add("hidden");

        document
        .getElementById("app")
        .classList.remove("hidden");


        /*
          Depois carregamos os dados.
          Se alguma tabela falhar,
          o sistema continua aberto.
        */

        await loadData();

        await dashboard();

    }catch(error){

        console.error(
            "ERRO DE LOGIN:",
            error
        );

        errorBox.textContent =
        "Não foi possível iniciar sessão: " +
        (error.message || "Erro desconhecido.");

        errorBox.classList.remove("hidden");

    }finally{

        button.disabled = false;

        button.textContent =
        "Entrar";

    }

});


/* =================================
   SESSÃO AUTOMÁTICA
================================= */

async function checkSession(){

    try{

        const c =
        getClient();

        const result =
        await c.auth.getSession();

        if(result.data.session){

            document
            .getElementById("loginScreen")
            .classList.add("hidden");

            document
            .getElementById("app")
            .classList.remove("hidden");

            await loadData();

            await dashboard();

        }

    }catch(error){

        console.error(
            "Sessão:",
            error
        );

    }

}


checkSession();


/* =================================
   NAVEGAÇÃO
================================= */

function page(name){

    document
    .querySelectorAll("nav button")
    .forEach(button => {

        button.classList.toggle(
            "active",
            button.dataset.page === name
        );

    });

    if(pages[name]){

        pages[name]();

    }

}


/* =================================
   DASHBOARD
================================= */

async function dashboard(){

    await loadData();

    const receitas =
    db.financas
    .filter(x => x.tipo === "Receita")
    .reduce(
        (total,x) =>
        total + Number(x.valor || 0),
        0
    );

    const despesas =
    db.financas
    .filter(x => x.tipo === "Despesa")
    .reduce(
        (total,x) =>
        total + Number(x.valor || 0),
        0
    );

    const unidadesAtivas =
    db.unidades
    .filter(x =>
        x.estado === "Ativa"
    ).length;


    content.innerHTML =

    top(
        "Dashboard",
        "Visão geral do clube",
        B(
            "+ Cadastrar membro",
            "primary",
            "page('membroForm')"
        )
    )

    +

    `
    <div class="cards">

        <div class="card stat">
            👥 Membros
            <strong>
                ${db.membros.length}
            </strong>
        </div>

        <div class="card stat">
            🏕️ Unidades
            <strong>
                ${unidadesAtivas}
            </strong>
        </div>

        <div class="card stat">
            📅 Atividades
            <strong>
                ${db.atividades.length}
            </strong>
        </div>

        <div class="card stat">
            💰 Saldo
            <strong>
                ${money(receitas-despesas)} Kz
            </strong>
        </div>

    </div>

    <div class="card">

        <h3>Acesso rápido</h3>

        <div class="actions"
             style="justify-content:flex-start">

            ${B(
                "👥 Membros",
                "secondary",
                "page('membros')"
            )}

            ${B(
                "🏕️ Unidades",
                "secondary",
                "page('unidades')"
            )}

            ${B(
                "📅 Atividades",
                "secondary",
                "page('atividades')"
            )}

            ${B(
                "💰 Finanças",
                "secondary",
                "page('financas')"
            )}

        </div>

    </div>
    `;

}


/* =================================
   MEMBROS
================================= */

async function membros(){

    await loadData();

    content.innerHTML =

    top(
        "Membros",
        "Cadastro e consulta dos desbravadores",
        B(
            "+ Cadastrar membro",
            "primary",
            "page('membroForm')"
        )
    )

    +

    `
    <div class="card">

        <div class="toolbar">

            <input
                id="memberSearch"
                placeholder="Pesquisar por nome, Nº ou utilizador..."
                oninput="renderMembers()">

        </div>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>Foto</th>
                        <th>Nº</th>
                        <th>Nome</th>
                        <th>Unidade</th>
                        <th>Função</th>
                        <th>Classe</th>
                        <th>Estado</th>
                        <th>Ação</th>

                    </tr>

                </thead>

                <tbody id="memberRows"></tbody>

            </table>

        </div>

    </div>
    `;

    renderMembers();

}


function renderMembers(){

    const search =
    document
    .getElementById("memberSearch");

    if(!search)return;

    const q =
    search.value
    .toLowerCase()
    .trim();

    const rows =
    db.membros.filter(m => {

        return (
            String(m.nome || "")
            .toLowerCase()
            .includes(q)
            ||

            String(m.numero_membro || "")
            .toLowerCase()
            .includes(q)
            ||

            String(m.utilizador || "")
            .toLowerCase()
            .includes(q)
        );

    });


    const tbody =
    document.getElementById("memberRows");


    if(!rows.length){

        tbody.innerHTML = `
        <tr>
            <td colspan="8"
                class="muted">
                Nenhum membro encontrado.
            </td>
        </tr>
        `;

        return;

    }


    tbody.innerHTML =
    rows.map(m => {

        const unidade =
        db.unidades.find(
            u => u.id === m.unidade_id
        );

        return `

        <tr>

            <td>

                ${
                    m.foto_url

                    ?

                    `<img
                        class="member-photo"
                        src="${esc(m.foto_url)}">`

                    :

                    `—`
                }

            </td>

            <td>
                <b>
                    ${esc(m.numero_membro)}
                </b>
            </td>

            <td>
                ${esc(m.nome)}
            </td>

            <td>
                ${esc(unidade?.nome || "—")}
            </td>

            <td>
                ${esc(m.funcao || "—")}
            </td>

            <td>
                ${esc(m.classe || "—")}
            </td>

            <td>
                <span class="badge">
                    ${esc(m.estado || "Ativo")}
                </span>
            </td>

            <td>
                ${B(
                    "Abrir",
                    "secondary",
                    `profile('${m.id}')`
                )}
            </td>

        </tr>

        `;

    }).join("");

}

async function saveMember(e){

    e.preventDefault();

    const form =
    new FormData(e.target);

    const c =
    getClient();


    const nome =
    String(form.get("nome") || "")
    .trim();


    if(!nome){

        alert(
            "Digite o nome completo."
        );

        return;

    }


    /*
      GERAÇÃO AUTOMÁTICA
    */

    const numero =
    generateNumber();

    const utilizador =
    generateUsername();

    const senha =
    randomPassword();


    let fotoUrl = null;


    try{

        /*
          FOTO
        */

        const photoInput =
        document.getElementById(
            "photoFile"
        );

        if(
            photoInput &&
            photoInput.files &&
            photoInput.files[0]
        ){

            const file =
            photoInput.files[0];

            const extension =
            file.name
            .split(".")
            .pop();

            const fileName =
            numero +
            "-" +
            Date.now() +
            "." +
            extension;


            const upload =
            await c.storage
            .from("fotos_membros")
            .upload(
                fileName,
                file,
                {
                    upsert:true
                }
            );


            if(upload.error){

                throw upload.error;

            }


            const publicUrl =
            c.storage
            .from("fotos_membros")
            .getPublicUrl(
                fileName
            );


            fotoUrl =
            publicUrl.data.publicUrl;

        }


        /*
          DADOS PARA A TABELA
        */

        const data = {

            numero_membro:numero,

            nome:nome,

            nascimento:
            form.get("nascimento") || null,

            sexo:
            form.get("sexo") || null,

            documento:
            form.get("documento") || null,

            telefone:
            form.get("telefone") || null,

            endereco:
            form.get("endereco") || null,

            unidade_id:
            form.get("unidade_id") || null,

            funcao:
            form.get("funcao") || null,

            classe:
            form.get("classe") || null,

            estado:
            form.get("estado") || "Ativo",

            pai:
            form.get("pai") || null,

            contacto_encarregado:
            form.get("contacto_encarregado") || null,

            encarregado:
            form.get("encarregado") || null,

            classe_escolar:
            form.get("classe_escolar") || null,

            escola:
            form.get("escola") || null,

            mae:
            form.get("mae") || null,

            foto_url:
            fotoUrl,

            utilizador:
            utilizador,

            data_cadastro:
            getToday()

        };


        /*
          INSERIR
        */

        const result =
        await c
        .from("membros")
        .insert([data])
        .select()
        .single();


        if(result.error){

            throw result.error;

        }


        db.membros.unshift(
            result.data
        );


        /*
          MOSTRAR CREDENCIAIS
        */

        showMemberCredentials(
            result.data,
            senha
        );


    }catch(error){

        console.error(
            "ERRO AO CADASTRAR:",
            error
        );

        alert(
            "Erro ao cadastrar membro:\n\n" +
            error.message
        );

    }

}

    .querySelector('[name="estado"]')
    .value =
    unidade.estado || "Ativa";


    document
    .getElementById("unitForm")
    .onsubmit =

            await unidades();
